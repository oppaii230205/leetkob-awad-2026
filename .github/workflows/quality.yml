name: Quality
run-name: Quality / ${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [pa2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            command: npm run lint
          - name: format
            command: npm run format:check
          - name: typecheck
            command: npm run typecheck
          - name: tests
            command: npm test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified from upstream tag
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified from upstream tag
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
