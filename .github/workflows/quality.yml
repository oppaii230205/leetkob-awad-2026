name: Quality
run-name: Quality / ${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [pa2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            command: npm run lint
          - name: format
            command: npm run format:check
          - name: typecheck
            command: npm run typecheck
          - name: tests
            command: npm test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
